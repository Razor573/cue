<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Cue Companion</title>
  <style>
    body {
      width: 270px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #141721;
      color: #f1f5f9;
      box-sizing: border-box;
    }
    h1 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 10px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }
    .badge.connected { background: #34d399; }
    .badge.disconnected { background: #f87171; }
    .badge.unpaired { background: #fbbf24; }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 11px;
      margin-bottom: 10px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .row:last-child { margin-bottom: 0; }
    .dim { color: #94a3b8; }
    button {
      width: 100%;
      padding: 7px 12px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 6px;
      transition: background 150ms ease;
    }
    button.primary {
      background: #3b82f6;
      color: #fff;
    }
    button.primary:hover { background: #2563eb; }
    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    button.secondary:hover { background: rgba(255, 255, 255, 0.14); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .feedback {
      font-size: 11px;
      min-height: 16px;
      margin-top: 4px;
      word-break: break-word;
    }
    .feedback.error { color: #f87171; }
    .feedback.success { color: #34d399; }
    .feedback.warn { color: #fbbf24; }
  </style>
</head>
<body>
  <h1><span id="status-dot" class="badge"></span> Cue Companion</h1>
  <div class="card">
    <div class="row">
      <span class="dim">Status:</span>
      <span id="status-text">Checking…</span>
    </div>
    <div class="row">
      <span class="dim">Port:</span>
      <span id="port-text">—</span>
    </div>
  </div>
  <button id="pair-btn" class="secondary">Pair with Cue</button>
  <button id="capture-btn" class="primary" disabled>Capture this page</button>
  <div id="feedback" class="feedback"></div>
  <script src="popup.js"></script>
</body>
</html>
